---

- name: Install MySQL
  apt: name=mysql-server state=present

- name: Install Python package pymysql
  apt:
    name: python3-pymysql
    state: present

- name: Configure MySQL to listen on all interfaces
  lineinfile:
    path: /etc/mysql/mysql.conf.d/mysqld.cnf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
    backup: yes
  loop:
    - { regexp: '^bind-address', line: 'bind-address = 0.0.0.0' }
  when: open_database

- name: Configure MySQL to listen on the specified port
  lineinfile:
    path: /etc/mysql/mysql.conf.d/mysqld.cnf
    regexp: '^port'
    line: 'port = {{ database_port }}'
    state: present
    backup: yes

# - name: Open MySQL port in firewall
#   ansible.posix.firewalld:
#     # TODO: variable database_port
#     port: 3306/tcp
#     permanent: yes
#     state: enabled
#     immediate: yes
#   when: open_database

- name: Set root database password
  ansible.mysql.mysql_user:
    name: root
    # TODO
    #encrypted: true
    plugin: caching_sha2_password
    plugin_auth_string: "{{ database_root_password }}"
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock
    host: localhost
  when: database_root_password != None and database_root_password | length > 0

- name: Save root db password in .my.cnf
  template:
    src: .my.cnf.j2
    dest: /root/.my.cnf
    owner: root
    mode: '0600'
  when: database_root_password != None and database_root_password | length > 0

- name: Remove all anonymous user accounts
  ansible.mysql.mysql_user:
    name: ''
    host_all: true
    state: absent
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Restart MySQL
  service:
    name: mysql
    state: restarted

- name: Create database user
  ansible.mysql.mysql_user:
    name:     "{{ database_username }}"
    plugin: caching_sha2_password
    plugin_auth_string: "{{ database_password }}"
    host: "{{ '%' if open_database else 'localhost' }}"
    # TODO
    #encrypted: true
    priv: '{{ database_name }}.*:ALL'
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock
  when: database_username != None and database_username | length > 0

- name: Create database
  ansible.mysql.mysql_db:
    name: "{{ database_name }}"
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock
  when: database_name != None and database_name | length > 0
